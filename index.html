<html lang="en">
<head>

<title>Isabelle Kwan</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F3EF;--card:#FFFDF9;--ink:#111111;--mute:#5d5a56;--line:#e6dfd6;--y:#FFE97A;--p:#F9B5C1;--m:#B7E1D1;--b:#A9D3FF;--on:#111;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151413;--card:#1e1d1b;--ink:#F7F3EF;--mute:#aaa59d;--line:#33312e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151413;--card:#1e1d1b;--ink:#F7F3EF;--mute:#aaa59d;--line:#33312e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 "Zen Maru Gothic",ui-rounded,"Hiragino Maru Gothic ProN",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
a{color:inherit}
:focus-visible{outline:3px solid var(--b);outline-offset:3px;border-radius:8px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1040px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;justify-content:space-between}
.logo{font-weight:700;font-size:18px;text-decoration:none;display:flex;gap:10px;align-items:center}
.logo svg{width:30px;height:30px}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:100%}
nav a{padding:6px 14px;border-radius:99px;text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap;border:1.5px solid transparent}
nav a:hover{border-color:var(--ink)}
nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
main{max-width:1040px;margin:0 auto;padding:0 20px}
.hero{position:relative;display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center;min-height:min(560px,80vh);padding:40px 0}
h1{font-size:clamp(34px,6vw,60px);line-height:1.2;margin:0 0 16px;font-weight:700}
h2{font-size:clamp(24px,3.4vw,32px);margin:0;line-height:1.3}
h3{margin:0;font-size:17px;line-height:1.4}
.lead{max-width:46ch;color:var(--mute);margin:0 0 24px}
.btn{display:inline-flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:700;font-size:14px;padding:10px 10px 10px 22px;border-radius:99px}
.btn i{font-style:normal;background:var(--y);color:#111;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--ink)}
.stage{position:relative;height:380px;touch-action:none}
.blob{position:absolute;cursor:grab;user-select:none;touch-action:none;filter:drop-shadow(0 6px 0 rgba(0,0,0,.06))}
.blob:active{cursor:grabbing}
.blob svg{width:100%;height:100%;display:block;pointer-events:none}
.hint{font-size:13px;color:var(--mute)}
section.band{padding:44px 0;border-top:1px solid var(--line)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.more{font-size:14px;font-weight:700;text-decoration:none;border-bottom:2px solid var(--y)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:8px}
.card p{margin:0;color:var(--mute);font-size:14.5px}
.card .when{font-size:13px;color:var(--mute)}
.card .authors{color:var(--mute);font-size:13.5px}
.card .authors b{color:var(--ink)}
a.card{text-decoration:none;transition:transform .2s}
a.card:hover{transform:translateY(-3px)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{font:inherit;font-size:14px;font-weight:500;padding:6px 16px;border-radius:99px;border:1.5px solid var(--ink);background:none;color:var(--ink);cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg)}
.pc{cursor:pointer}
.pcover{aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:var(--line);margin-bottom:6px}
.pcover img,.pcover video{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.modal{width:calc(100% - 32px);max-width:900px;max-height:92vh;max-height:92dvh;overflow-y:auto;border:1px solid var(--line);border-radius:24px;padding:0;background:var(--card);color:var(--ink)}
.modal::backdrop{background:rgba(0,0,0,.6)}
.mbox{position:relative;padding:clamp(22px,5vw,48px)}
.mbox h2{font-size:clamp(30px,5vw,46px);margin:0 48px 10px 0}
.mbox p{color:var(--mute);margin:0}
.mclose{position:absolute;top:18px;right:20px;width:40px;height:40px;font-size:28px;line-height:1;background:none;border:1px solid var(--line);border-radius:50%;color:var(--ink);cursor:pointer}
.case-kicker{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:10px}
.case-intro{font-size:clamp(17px,2.4vw,20px);max-width:60ch}
.case-content{margin-top:32px;max-width:70ch}
.case-section{padding:24px 0;border-top:1px solid var(--line)}
.case-section h3{font-size:21px;margin:0 0 10px}
.case-section p+p{margin-top:12px}
.case-gallery{border-top:1px solid var(--line);padding-top:24px}
.case-gallery h3{font-size:21px;margin-bottom:6px}
.shots{display:grid;gap:14px;margin-top:18px}
.shots img,.shots video{width:100%;border-radius:12px;border:1px solid var(--line)}
.shots video{max-height:60vh;object-fit:contain;justify-self:center;background:#000}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:12px;font-weight:500;padding:2px 12px;border-radius:99px;color:#111}
.t0{background:var(--y)}.t1{background:var(--p)}.t2{background:var(--m)}.t3{background:var(--b)}
.list .card{margin-bottom:16px}
.page-title{padding:48px 0 12px}
.page-title p{color:var(--mute);max-width:52ch;margin:8px 0 0}
.about{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;scrollbar-width:none}
.vid{flex:0 0 min(300px,78%);scroll-snap-align:start;text-decoration:none}
.thumb{aspect-ratio:16/9;border-radius:20px;display:grid;place-items:center;overflow:hidden;position:relative;margin-bottom:10px}
.thumb img{width:100%;height:100%;object-fit:contain;background:#000}
.play{width:46px;height:46px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.play::after{content:"";border-left:14px solid var(--bg);border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:4px}
.arrows{display:flex;gap:8px}
.arrows button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--ink);background:none;color:var(--ink);font:700 16px inherit;cursor:pointer}
.arrows button:hover{background:var(--y);color:#111;border-color:#111}
footer{margin-top:40px;border-top:1px solid var(--line);background:var(--card)}
.foot{max-width:1040px;margin:0 auto;padding:28px 20px 40px}
.tray{position:relative;min-height:220px;border:2px dashed var(--line);border-radius:28px;margin:16px 0;overflow:hidden;touch-action:none}
.tray .ph{position:absolute;inset:auto 0 12px;text-align:center;font-size:13px;color:var(--mute)}
.sticker{position:absolute;width:96px;cursor:grab;touch-action:none;user-select:none}
.sticker img{width:100%;display:block;pointer-events:none}
.links{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn.small{padding:6px 16px;font-size:13px;cursor:pointer;border:0;font-family:inherit}
@media(max-width:720px){.hero{grid-template-columns:1fr}.stage{height:280px}.about{grid-template-columns:1fr}.bar{flex-direction:column;align-items:flex-start;gap:6px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* Case studies describe the work shown here; open questions are not presented as tested outcomes. */
var CASES=[
{intro:'A party game built around the wonderfully messy question: who was actually in the wrong?',
sections:[
['The opportunity','Reading a dramatic story is fun on your own; arguing about it with friends is even better. The challenge was to turn that familiar moment into a shared game without making everyone learn a complicated set of rules before they could join in.'],
['From a room to a round','The host screen starts with a large room code and QR code, giving the group a common place to gather while players join on their phones. The lobby also brings rounds, game mode and timers together, so the host can shape the session before everyone begins.','During play, the shared display carries the group through each phase while the phone becomes a personal place to make a choice. Verdicts, guessing the real outcome and debate turn a story into several different kinds of participation. A final scoreboard and a return to the lobby give the session a clear ending and a way to play again.'],
['The design tension','A multiplayer experience has to make sense in two places at once: the room needs a shared sense of what is happening, but each player needs to know what to do on their own screen. Round labels, timers and visible participation counts help make that state legible without taking attention away from the conversation.','The lobby also includes a guide to unfamiliar Reddit terminology and a content setting. Both acknowledge that players can arrive with different levels of context and comfort.'],
['What I would explore next','I would want to watch groups join, switch between screens and move through a full round: where do people hesitate, and does a timer create energy or pressure? I would also look closely at how the game handles late arrivals, disconnections and content that a group would rather skip.']
]},
{intro:'Connecting people who want to participate in research with the researchers organizing it.',
sections:[
['The opportunity','Research participation involves more than finding a study. A student needs enough information to decide whether it fits; a researcher needs to communicate expectations, review applicants and keep sessions organized. The design brings those two perspectives into one place rather than treating recruitment as a single sign-up button.'],
['Walking through the experience','A participant can browse studies, search by title or description, and narrow the list by category or remote versus in-person participation. Each listing surfaces details such as location and compensation alongside an eligibility action, helping someone assess an opportunity before committing more time.','The participant dashboard pairs discovery with a calendar and study statuses, so the journey does not end at application. On the other side, researchers can create a study with a description, category and compensation, then review applicants and their screening status.'],
['The design tension','The same system has to be useful to two audiences without blurring their different jobs. Participants need clarity about what happens next; researchers need enough structure to manage incoming applications. Status labels and distinct participant and researcher views make that handoff more understandable.','Trust is as important as convenience here. Eligibility, compensation and application decisions affect real people, so the interface needs to make expectations visible rather than asking users to infer them.'],
['What I would explore next','I would test the full journey with both participants and researchers, especially the moments between applying, approval and booking. I would also examine how clearly the experience explains eligibility, rejection, privacy and changes to a session.']
]},
{intro:'A friendly mobile gardening experience for people who are still figuring out their green thumb.',
sections:[
['The opportunity','Starting to care for plants can feel surprisingly uncertain: what does this plant need, and how much am I expected to know already? PhotoSynthesis approaches that uncertainty as an onboarding problem as much as a plant-care problem. The aim is to make the first interaction feel welcoming rather than like a test.'],
['Walking through the experience','The concept opens with a simple welcome and account creation, then asks people how they describe themselves as gardeners. The options range from novice to expert and include “unsure” — a small but important acknowledgement that not everyone has a tidy label for their experience.','A plant character, soft colours and illustrated growth stages give the flow a more encouraging tone. The video below shows the experience in motion, which is especially useful for understanding how one screen leads into the next.'],
['The design tension','Personalization can help make advice feel relevant, but too many questions up front can make getting started feel like work. This flow uses a single, approachable experience-level question as an entry point. The “unsure” option leaves room for people who may not yet know what kind of help they need.','The visual personality is meant to make the experience feel less intimidating; it still has to support legible labels, clear choices and an obvious next step.'],
['What I would explore next','I would explore whether new growers understand what happens after onboarding and whether their chosen experience level leads to useful guidance. It would also be worth checking readability and accessibility across devices, and whether people can change their answer as their confidence grows.']
]},
{intro:'A browser extension that brings the personality of a sticker into everyday browsing.',
sections:[
['The opportunity','A sticker can communicate a mood in an instant. Sticky Send takes that playful visual language into the browser, where it can sit alongside the pages and conversations people are already using instead of requiring a separate creative workflow.'],
['Walking through the experience','The extension gives people a way to choose and send stickers, and to add something more personal. The add-sticker flow offers two routes: describe an image to generate one, or upload an existing image instead. That choice matters because not everyone wants to start from a prompt, and some people already have an illustration they love.','The screenshots show stickers appearing over a page, making the result feel like an interaction with the browsing surface rather than just another image in a library.'],
['The design tension','The playful part should be immediate, but an overlay still needs to coexist with the page underneath. A sticker should add expression without making important content impossible to read or controls difficult to reach. The friendly, scrapbook-like visual treatment sets the tone, while a prominent close control gives the creation flow an exit.','Generation also introduces uncertainty: a description may not produce what someone imagined. Uploading provides a different path to the same goal without requiring a perfect prompt.'],
['What I would explore next','I would look at how people discover sending and managing stickers, and what happens when a generated result is not quite right. Consent, dismissal, keyboard access and the effect of overlays on different websites would be important areas to investigate before calling the experience complete.']
]},
{intro:'A gift-wrapping concept that makes an online purchase feel a little more personal.',
sections:[
['The opportunity','Choosing a gift is personal, but online checkout can make the final presentation feel abstract. The question behind this concept is how to let someone make thoughtful wrapping choices when they cannot hold the finished package in their hands.'],
['Walking through the experience','The flow breaks customization into manageable decisions: select wrapping paper, choose a ribbon colour and width, and see the gift in a 3D preview. The numbered groups make the available choices easy to scan, while the preview gives those choices a visual context. A next-gift action keeps the flow moving when there is more than one item.','The card screen then shifts from appearance to the message itself: choose a card, write a salutation and message, and add a sign-off before finishing checkout. That sequence connects the physical presentation with the words the recipient will see.'],
['The design tension','Customization should feel expressive, not like a long series of configuration tasks. Grouping a few related choices and keeping the preview close to the controls helps connect an action to its intended result. At the same time, a 3D view is only a representation: the experience should not imply more certainty about the finished wrap than the preview can provide.','The card also has a character limit, making the constraint visible while someone writes rather than leaving it to the end.'],
['What I would explore next','I would test whether people notice changes in the preview, understand which gift they are editing, and feel confident about the final result before checkout. A useful next step would be a clear review of all gifts, messages and any costs, as well as an accessible alternative to relying on colour or 3D alone.']
]},
{intro:'Helping people find exercises and keep track of their own fitness goals.',
sections:[
['The opportunity','A visit to the gym can begin with a deceptively difficult question: what should I actually do? SFU FitTrack brings exercise discovery and personal tracking together in the context of the SFU Recreation Centre, so a person can move from exploring options to keeping track of their own activity.'],
['Walking through the experience','The exercise catalogue presents movements as cards with their category, target muscles and equipment. A muscle search gives people a way to narrow the list based on what they want to work on. Those details make it easier to compare exercises before choosing one.','The account view brings personal activity back into the picture, with goals and liked exercises visible together. Saving an exercise creates a bridge between browsing something interesting and returning to it later.'],
['The design tension','A catalogue needs enough detail to be useful without overwhelming someone who is new to exercise. Showing the target muscles and equipment on each card supports quick comparison, but those labels alone do not tell someone whether a movement is appropriate or how to perform it safely.','Tracking adds another consideration: progress is personal. A useful account experience should help someone understand their own goals without assuming that everyone measures success in the same way.'],
['What I would explore next','I would explore how beginners choose an exercise, whether they can find clear guidance on form and modifications, and how they interpret their progress over time. Accessibility, privacy and ways to support different abilities would be important considerations for further development.']
]}
];

return x.u?'<a class="card" href="'+x.u+'"'+(x.u.charAt(0)=='#'?'':' target="_blank" rel="noopener"')+'>'+inner+'</a>':'<div class="card">'+inner+'</div>'}
function band(title,items,page,n){return '<section class="band"><div class="head"><h2>'+title+'</h2><a class="more" href="#'+page+'">See all</a></div><div class="grid">'+items.slice(0,n||3).map(card).join('')+'</div></section>'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function railHTML(){return VIDEOS.map(function(v,i){return '<a class="vid" href="'+esc(v.u)+'" target="_blank" rel="noopener"><div class="thumb" style="background:'+C[i%4]+'">'+(v.img?'<img src="'+esc(v.img)+'" alt="">':'<span class="play"></span>')+'</div><h3>'+esc(v.t)+'</h3></a>'}).join('')}
function videos(){return '<section class="band"><div class="head"><h2>Videos</h2><a class="more" href="https://www.youtube.com/channel/'+YT_CHANNEL_ID+'" target="_blank" rel="noopener">Visit my YouTube channel →</a><div class="arrows"><button aria-label="Previous" onclick="scr(-1)">←</button><button aria-label="Next" onclick="scr(1)">→</button></div></div><div class="rail" id="rail">'+railHTML()+'</div></section>'}
var videosLoaded=false;
function loadVideos(){
if(!YT_API_KEY||/^YOUR/.test(YT_API_KEY)||!/^UC/.test(YT_CHANNEL_ID))return;
function paint(){var r=document.getElementById('rail');if(r)r.innerHTML=railHTML()}
if(videosLoaded){paint();return}
fetch('https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=4&playlistId=UU'+YT_CHANNEL_ID.slice(2)+'&key='+encodeURIComponent(YT_API_KEY))
.then(function(r){return r.json()})
.then(function(d){if(!d.items||!d.items.length)return;
VIDEOS=d.items.map(function(it){var s=it.snippet,id=s.resourceId.videoId,th=s.thumbnails||{};return {t:s.title,u:'https://www.youtube.com/watch?v='+id,img:(th.medium||th.high||th.default||{}).url||''}});
videosLoaded=true;paint()})
.catch(function(){})}
function pcard(p,i,all){if(!all&&PF!='All'&&p.tg.indexOf(PF)<0)return '';
return '<div class="card pc" role="button" tabindex="0" aria-label="Read the '+esc(p.t)+' case study" onclick="openProj('+i+')" onkeydown="if(event.key==\'Enter\'||event.key==\' \'){event.preventDefault();openProj('+i+')}"><div class="pcover">'+(p.thumb||p.imgs[0]?'<img src="'+(p.thumb||p.imgs[0])+'" alt="" loading="lazy">':p.video?'<video src="'+p.video+'#t=0.5" preload="metadata" muted playsinline></video>':'')+'</div><h3>'+p.t+'</h3><p>'+p.d+'</p>'+tags(p.tg)+'<span class="more">Read case study →</span></div>'}
function pband(){return '<section class="band"><div class="head"><h2>Projects</h2><a class="more" href="#projects">See all</a></div><div class="grid">'+PROJECTS.slice(0,3).map(function(p,i){return pcard(p,i,1)}).join('')+'</div></section>'}
function setPF(t){PF=t;document.getElementById('app').innerHTML=VIEW.projects()}
function openProj(i){var p=PROJECTS[i],c=CASES[i],trigger=document.activeElement,m=document.createElement('dialog');m.className='modal';m.setAttribute('aria-labelledby','case-title');
m.innerHTML='<div class="mbox"><button class="mclose" aria-label="Close case study" autofocus>×</button><div class="case-kicker">Project case study</div><h2 id="case-title">'+esc(p.t)+'</h2><p class="case-intro">'+esc(c.intro)+'</p>'+tags(p.tg)+'<div class="case-content">'+c.sections.map(function(s){return '<section class="case-section"><h3>'+esc(s[0])+'</h3>'+s.slice(1).map(function(text){return '<p>'+esc(text)+'</p>'}).join('')+'</section>'}).join('')+'</div><section class="case-gallery"><h3>Project visuals</h3><p>'+(p.video?'Watch the demonstration below.':'A closer look at the screens described above.')+'</p><div class="shots">'+(p.video?'<video src="'+p.video+'" controls preload="metadata" playsinline aria-label="'+esc(p.t)+' demonstration video"></video>':'')+p.imgs.map(function(s,n){return '<img src="'+s+'" alt="'+esc(p.t)+' project screenshot '+(n+1)+'" loading="lazy">'}).join('')+'</div></section></div>';
m.querySelector('.mclose').addEventListener('click',function(){m.close()});
m.addEventListener('keydown',function(e){if(e.key=='Escape'){e.preventDefault();m.close()}});
m.addEventListener('close',function(){m.remove();if(trigger&&trigger.isConnected)trigger.focus()});
document.body.appendChild(m);m.showModal()}
function scr(d){var r=document.getElementById('rail');r.scrollBy({left:d*320,behavior:'smooth'})}
function title(t,p){return '<div class="page-title"><h1>'+t+'</h1><p>'+p+'</p></div>'}
var VIEW={
home:function(){return '<section class="hero"><div><h1>Hi, I’m Isabelle. I like making data and ideas easier to understand.</h1><p class="lead">I&#39;m an undergraduate computing science student at SFU with a specialization in human-computer interaction: visualization, sensemaking, and design. Currently doing research, building things and organizing community events.</p><div class="row"><a class="btn" href="#research">See my research <i>→</i></a><a class="btn ghost" href="Isabelle_Kwan_CV__Graduate_School.pdf" target="_blank" rel="noopener">View CV</a></div></div><div class="stage" id="stage"></div></section>'
+'<p class="hint" style="margin-top:-20px">Tip: the blobs are draggable. </p>'
+band('Publications',PUBS,'research')+band('Research experience',RES,'research')+band('Professional experience',WORK,'work',1)+pband()+band('Side quests',SIDE,'sidequests')+videos()},
research:function(){return title('Research','Papers and lab work in HCI, AR and visualization.')+'<h2 style="margin:16px 0">Publications</h2><div class="grid">'+PUBS.map(function(p){return card({t:p.t,a:p.a,d:p.d,w:p.w,tg:p.tg,u:p.u})}).join('')+'</div><h2 style="margin:40px 0 16px">Research experience</h2><div class="grid">'+RES.map(card).join('')+'</div>'},
work:function(){return title('Work','Where I’ve built software professionally.')+'<div class="grid">'+WORK.map(card).join('')+'</div>'},
projects:function(){var all=[];PROJECTS.forEach(function(p){p.tg.forEach(function(t){if(all.indexOf(t)<0)all.push(t)})});
return title('Projects','Things I’ve built and designed, with a closer look at the ideas and decisions behind each one.')+'<div class="filters" role="group" aria-label="Filter projects">'+['All'].concat(all).map(function(t){return '<button class="chip'+(t==PF?' on':'')+'" onclick="setPF(this.textContent)">'+esc(t)+'</button>'}).join('')+'</div><div class="grid">'+PROJECTS.map(function(p,i){return pcard(p,i)}).filter(Boolean).join('')+'</div>'},
sidequests:function(){return title('Side quests','Community, leadership and everything in between.')+'<div class="grid">'+SIDE.map(card).join('')+'</div>'+videos()+'<section class="band"><h2>Recognition</h2><div class="grid" style="margin-top:16px">'+[['CRA Outstanding Undergraduate Researchers nominee','2026'],['EA Dick Asher Award','2026'],['Grace Hopper Conference Scholar','2025'],['BC Excellence Award','2022']].map(function(a){return card({t:a[0],w:a[1],d:''})}).join('')+'</div></section>'}
};
function drag(el,box){var sx,sy,ox,oy;el.addEventListener('pointerdown',function(e){el.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=el.offsetLeft;oy=el.offsetTop;el.style.zIndex=5;
function mv(ev){var x=ox+ev.clientX-sx,y=oy+ev.clientY-sy;x=Math.max(0,Math.min(box.clientWidth-el.offsetWidth,x));y=Math.max(0,Math.min(box.clientHeight-el.offsetHeight,y));el.style.left=x+'px';el.style.top=y+'px'}
function up(){el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up)}
el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up)})}
function stage(){var s=document.getElementById('stage');if(!s)return;
[[0,150,10,20,0],[1,110,170,60,1],[2,90,50,250,0],[3,70,230,230,1]].forEach(function(b){var d=document.createElement('div');d.className='blob';d.style.cssText='width:'+b[1]+'px;height:'+b[1]+'px;left:'+b[2]+'px;top:'+b[3]+'px';d.innerHTML=blob(C[b[0]],b[4],b[0]*25);s.appendChild(d);drag(d,s)})}
function route(){var h=(location.hash||'#home').slice(1);if(!VIEW[h])h='home';
document.getElementById('nav').innerHTML=PAGES.map(function(p){return '<a href="#'+p[0]+'"'+(p[0]==h?' aria-current="page"':'')+'>'+p[1]+'</a>'}).join('');
document.getElementById('app').innerHTML=VIEW[h]();document.title=(h=='home'?'':PAGES.filter(function(p){return p[0]==h})[0][1]+' · ')+'Isabelle Kwan';window.scrollTo(0,0);stage();loadVideos()}
function sticker(html,x,y){var t=document.getElementById('tray'),d=document.createElement('div');d.className='sticker';d.style.left=x+'px';d.style.top=y+'px';d.innerHTML=html;t.appendChild(d);drag(d,t)}
document.getElementById('logoBlob').innerHTML=blob(C[0],1);
[[0,20],[1,130],[2,240]].forEach(function(a,i){sticker(blob(C[i],1,i*30),a[1],30)});
document.getElementById('file').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){sticker('<img alt="" src="'+r.result+'">',40+Math.random()*300,60+Math.random()*60)};r.readAsDataURL(f);e.target.value=''});
document.getElementById('theme').addEventListener('click',function(){var r=document.documentElement,d=r.getAttribute('data-theme')=='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);r.setAttribute('data-theme',d?'light':'dark')});
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
