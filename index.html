<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isabelle Kwan</title>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F3EF;--card:#FFFDF9;--ink:#111111;--mute:#5d5a56;--line:#e6dfd6;--y:#FFE97A;--p:#F9B5C1;--m:#B7E1D1;--b:#A9D3FF;--on:#111;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151413;--card:#1e1d1b;--ink:#F7F3EF;--mute:#aaa59d;--line:#33312e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#151413;--card:#1e1d1b;--ink:#F7F3EF;--mute:#aaa59d;--line:#33312e;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 "Zen Maru Gothic",ui-rounded,"Hiragino Maru Gothic ProN",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
a{color:inherit}
:focus-visible{outline:3px solid var(--b);outline-offset:3px;border-radius:8px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{max-width:1040px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;justify-content:space-between}
.logo{font-weight:700;font-size:18px;text-decoration:none;display:flex;gap:10px;align-items:center}
.logo svg{width:30px;height:30px}
nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;max-width:100%}
nav a{padding:6px 14px;border-radius:99px;text-decoration:none;font-size:14px;font-weight:500;white-space:nowrap;border:1.5px solid transparent}
nav a:hover{border-color:var(--ink)}
nav a[aria-current="page"]{background:var(--ink);color:var(--bg)}
main{max-width:1040px;margin:0 auto;padding:0 20px}
.hero{position:relative;display:grid;grid-template-columns:1.2fr 1fr;gap:20px;align-items:center;min-height:min(560px,80vh);padding:40px 0}
h1{font-size:clamp(34px,6vw,60px);line-height:1.2;margin:0 0 16px;font-weight:700}
h2{font-size:clamp(24px,3.4vw,32px);margin:0;line-height:1.3}
h3{margin:0;font-size:17px;line-height:1.4}
.lead{max-width:46ch;color:var(--mute);margin:0 0 24px}
.btn{display:inline-flex;align-items:center;gap:12px;background:var(--ink);color:var(--bg);text-decoration:none;font-weight:700;font-size:14px;padding:10px 10px 10px 22px;border-radius:99px}
.btn i{font-style:normal;background:var(--y);color:#111;width:26px;height:26px;border-radius:50%;display:grid;place-items:center}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--ink)}
.stage{position:relative;height:380px;touch-action:none}
.blob{position:absolute;cursor:grab;user-select:none;touch-action:none;filter:drop-shadow(0 6px 0 rgba(0,0,0,.06))}
.blob:active{cursor:grabbing}
.blob svg{width:100%;height:100%;display:block;pointer-events:none}
.hint{font-size:13px;color:var(--mute)}
section.band{padding:44px 0;border-top:1px solid var(--line)}
.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.more{font-size:14px;font-weight:700;text-decoration:none;border-bottom:2px solid var(--y)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;display:flex;flex-direction:column;gap:8px}
.card p{margin:0;color:var(--mute);font-size:14.5px}
.card .when{font-size:13px;color:var(--mute)}
a.card{text-decoration:none;transition:transform .2s}
a.card:hover{transform:translateY(-3px)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tag{font-size:12px;font-weight:500;padding:2px 12px;border-radius:99px;color:#111}
.t0{background:var(--y)}.t1{background:var(--p)}.t2{background:var(--m)}.t3{background:var(--b)}
.list .card{margin-bottom:16px}
.page-title{padding:48px 0 12px}
.page-title p{color:var(--mute);max-width:52ch;margin:8px 0 0}
.about{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;scrollbar-width:none}
.vid{flex:0 0 min(300px,78%);scroll-snap-align:start;text-decoration:none}
.thumb{aspect-ratio:16/9;border-radius:20px;display:grid;place-items:center;overflow:hidden;position:relative;margin-bottom:10px}
.thumb img{width:100%;height:100%;object-fit:contain;background:#000}
.play{width:46px;height:46px;border-radius:50%;background:var(--ink);display:grid;place-items:center}
.play::after{content:"";border-left:14px solid var(--bg);border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:4px}
.arrows{display:flex;gap:8px}
.arrows button{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--ink);background:none;color:var(--ink);font:700 16px inherit;cursor:pointer}
.arrows button:hover{background:var(--y);color:#111;border-color:#111}
footer{margin-top:40px;border-top:1px solid var(--line);background:var(--card)}
.foot{max-width:1040px;margin:0 auto;padding:28px 20px 40px}
.tray{position:relative;min-height:220px;border:2px dashed var(--line);border-radius:28px;margin:16px 0;overflow:hidden;touch-action:none}
.tray .ph{position:absolute;inset:auto 0 12px;text-align:center;font-size:13px;color:var(--mute)}
.sticker{position:absolute;width:96px;cursor:grab;touch-action:none;user-select:none}
.sticker img{width:100%;display:block;pointer-events:none}
.slot{width:96px;height:96px;border:2px dashed var(--mute);border-radius:50%;display:grid;place-items:center;font-size:11px;text-align:center;color:var(--mute);background:var(--bg)}
.links{display:flex;gap:18px;flex-wrap:wrap;font-size:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn.small{padding:6px 16px;font-size:13px;cursor:pointer;border:0;font-family:inherit}
@media(max-width:720px){.hero{grid-template-columns:1fr}.stage{height:280px}.about{grid-template-columns:1fr}.bar{flex-direction:column;align-items:flex-start;gap:6px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="bar">
<a class="logo" href="#home" aria-label="Home"><span id="logoBlob"></span>Isabelle Kwan</a>
<nav id="nav" aria-label="Main"></nav>
</div></header>
<main id="app"></main>
<footer><div class="foot">
<h3>Stickers</h3>
<p class="hint" style="margin:4px 0 0">Drag these around. Add your own drawings with the button below (PNG with a transparent background works best).</p>
<div class="tray" id="tray"><div class="ph">your drawings land here</div></div>
<div class="row"><label class="btn small">Add a sticker<input id="file" type="file" accept="image/*" hidden></label><button class="btn small ghost" id="theme">Light / dark</button></div>
<div class="links" style="margin-top:22px"><a href="mailto:isabelletlkwan@gmail.com">Email</a><a href="https://www.linkedin.com/in/isabelle-kwan">LinkedIn</a><a href="https://github.com/isabellekwan">GitHub</a><a href="https://scholar.google.ca/citations?user=GEelmSwAAAAJ&amp;hl=en&amp;oi=ao">Google Scholar</a><a href="https://www.youtube.com/">YouTube</a></div>
<p class="hint">© 2026 Isabelle Kwan. Vancouver, B.C.</p>
</div></footer>
<script>
/* ===== EDIT YOUR CONTENT HERE ===== */
var T=function(a){return a};
var PUBS=[
{t:'The Choreography of Augmented Reality Timelines',d:'Relative position, chronology and situatedness of event sequences.',w:'Graphics Interface 2026',u:'https://doi.org/10.1145/3831423.3831457',tg:['AR','Visualization']},
{t:'Understanding AI Literacy for Creatives',d:'Tensions between structured tutorials and self-experimentation.',w:'Creativity & Cognition 2026',u:'https://doi.org/10.1145/3803784.3807570',tg:['HCI','AI']},
{t:'MILESTONES',d:'Design and field evaluation of a semi-automated tool that supports self-directed learning for online learners.',w:'CHI 2025',u:'https://doi.org/10.1145/3706598.3714295',tg:['HCI','Learning']}];
var RES=[
{t:'Research Assistant, SFU PADComp',w:'Sep 2026 – now',d:'Interactive visualizations for a large-scale simulation of collective action and data migration across platforms. User studies for PaperMuncher, an LLM tool that converts papers between disciplinary forms.',tg:['Python','Vega-Lite','DuckDB','Mosaic']},
{t:'Research Intern, UW HCI Lab',w:'Sep – Dec 2025',d:'Built a tablet AR app in Unity for 3D spatial interaction and data exploration, then ran user studies on 3D timelines.',tg:['C#','ARCore','Unity']},
{t:'Research Intern, SFU Interactive Experiences Lab',w:'May – Sep 2024',d:'Turned study habits into interactive Vega-Lite visualizations and managed four projects, from agendas to user studies.',tg:['JavaScript','React','Vega-Lite']}];
var WORK=[
{t:'Software Engineering Intern, Excelar Technologies',w:'Sep 2024 – Apr 2025',d:'Designed APIs that were 25% faster, reworked data models and schemas (20% faster queries), and refactored ETL pipelines for 15% better throughput.',tg:['Python','Node.js','PostgreSQL','Docker']}];
var TECH=[
{t:'Project name',d:'One line on what it does and why you built it.',tg:['React','Python'],u:'#tech'},
{t:'Project name',d:'One line on what it does and why you built it.',tg:['Unity','C#'],u:'#tech'},
{t:'Project name',d:'One line on what it does and why you built it.',tg:['Vega-Lite'],u:'#tech'}];
var DESIGN=[
{t:'Design project',d:'Describe the problem, your role and the outcome.',tg:['Figma','Research'],u:'#design'},
{t:'Design project',d:'Describe the problem, your role and the outcome.',tg:['Branding'],u:'#design'},
{t:'Design project',d:'Describe the problem, your role and the outcome.',tg:['Illustration'],u:'#design'}];
var SIDE=[
{t:'CAN-CWIC West',w:'2024 – now',d:'Co-founder and host of a regional conference for women in computing.',tg:['Community']},
{t:'SFU Senate',w:'2025 – now',d:'Student senator at Simon Fraser University.',tg:['Leadership']},
{t:'SFU Women in Computing Science',w:'2026 – now',d:'Director of Graduate Events.',tg:['Community']}];
var YT_CHANNEL_ID='UC11O9tOQoa0FszZdmI4oAKw'; /* starts with UC..., find it at youtube.com/account_advanced */
var YT_API_KEY='AIzaSyDh_LwO2tMv9y2BKPvVs1NybbmByE5ylws'; /* restricted to https://isabellekwan.ca/* and YouTube Data API v3 only */
var VIDEOS=[ /* add img:'data:image/png;base64,...' for a real thumbnail */
{t:'Video title one',u:'https://www.youtube.com/watch?v=YOUR_VIDEO_ID'},
{t:'Video title two',u:'https://www.youtube.com/watch?v=YOUR_VIDEO_ID'},
{t:'Video title three',u:'https://www.youtube.com/watch?v=YOUR_VIDEO_ID'},
{t:'Video title four',u:'https://www.youtube.com/watch?v=YOUR_VIDEO_ID'}];
/* ================================== */
var C=['#FFE97A','#F9B5C1','#B7E1D1','#A9D3FF'];
var PAGES=[['home','Home'],['research','Research'],['work','Work'],['tech','Tech'],['design','Design'],['sidequests','Side quests']];
function blob(c,eyes,rot){return '<svg viewBox="0 0 100 100" style="transform:rotate('+(rot||0)+'deg)" aria-hidden="true"><path d="M50 8C72 4 94 22 92 46C90 72 70 94 46 90C22 86 6 66 10 42C13 24 30 11 50 8Z" fill="'+c+'"/>'+(eyes?'<ellipse cx="40" cy="46" rx="4" ry="6" fill="#111"/><ellipse cx="60" cy="46" rx="4" ry="6" fill="#111"/>':'')+'</svg>'}
function tags(a){return a&&a.length?'<div class="tags">'+a.map(function(x,i){return '<span class="tag t'+(i%4)+'">'+x+'</span>'}).join('')+'</div>':''}
function card(x){var inner=(x.w?'<span class="when">'+x.w+'</span>':'')+'<h3>'+x.t+'</h3><p>'+x.d+'</p>'+tags(x.tg);
return x.u?'<a class="card" href="'+x.u+'"'+(x.u.charAt(0)=='#'?'':' target="_blank" rel="noopener"')+'>'+inner+'</a>':'<div class="card">'+inner+'</div>'}
function band(title,items,page,n){return '<section class="band"><div class="head"><h2>'+title+'</h2><a class="more" href="#'+page+'">See all</a></div><div class="grid">'+items.slice(0,n||3).map(card).join('')+'</div></section>'}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function railHTML(){return VIDEOS.map(function(v,i){return '<a class="vid" href="'+esc(v.u)+'" target="_blank" rel="noopener"><div class="thumb" style="background:'+C[i%4]+'">'+(v.img?'<img src="'+esc(v.img)+'" alt="">':'<span class="play"></span>')+'</div><h3>'+esc(v.t)+'</h3></a>'}).join('')}
function videos(){return '<section class="band"><div class="head"><h2>Videos</h2><div class="arrows"><button aria-label="Previous" onclick="scr(-1)">←</button><button aria-label="Next" onclick="scr(1)">→</button></div></div><div class="rail" id="rail">'+railHTML()+'</div></section>'}
var videosLoaded=false;
function loadVideos(){
if(!YT_API_KEY||/^YOUR/.test(YT_API_KEY)||!/^UC/.test(YT_CHANNEL_ID))return;
function paint(){var r=document.getElementById('rail');if(r)r.innerHTML=railHTML()}
if(videosLoaded){paint();return}
fetch('https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=4&playlistId=UU'+YT_CHANNEL_ID.slice(2)+'&key='+encodeURIComponent(YT_API_KEY))
.then(function(r){return r.json()})
.then(function(d){if(!d.items||!d.items.length)return;
VIDEOS=d.items.map(function(it){var s=it.snippet,id=s.resourceId.videoId,th=s.thumbnails||{};return {t:s.title,u:'https://www.youtube.com/watch?v='+id,img:(th.medium||th.high||th.default||{}).url||''}});
videosLoaded=true;paint()})
.catch(function(){})}
function scr(d){var r=document.getElementById('rail');r.scrollBy({left:d*320,behavior:'smooth'})}
function title(t,p){return '<div class="page-title"><h1>'+t+'</h1><p>'+p+'</p></div>'}
var VIEW={
home:function(){return '<section class="hero"><div><h1>Hi, I’m Isabelle. I like making data and ideas easier to touch.</h1><p class="lead">Computing science student at SFU working on visual and interactive computing: AR, visualization and human-computer interaction. Currently doing research, building things and organizing community events.</p><div class="row"><a class="btn" href="#research">See my research <i>→</i></a><a class="btn ghost" href="Isabelle_Kwan_CV__Graduate_School_.pdf" target="_blank" rel="noopener">View CV</a></div></div><div class="stage" id="stage"></div></section>'
+'<p class="hint" style="margin-top:-20px">Tip: the blobs are draggable. </p>'
+band('Publications',PUBS,'research')+band('Research experience',RES,'research')+band('Professional experience',WORK,'work',1)+band('Tech projects',TECH,'tech')+band('Design projects',DESIGN,'design')+band('Side quests',SIDE,'sidequests')+videos()},
research:function(){return title('Research','Papers and lab work in HCI, AR and visualization.')+'<h2 style="margin:16px 0">Publications</h2><div class="grid">'+PUBS.map(function(p){return card({t:p.t,d:p.d,w:p.w,tg:p.tg,u:p.u})}).join('')+'</div><h2 style="margin:40px 0 16px">Research experience</h2><div class="grid">'+RES.map(card).join('')+'</div>'},
work:function(){return title('Work','Where I’ve built software professionally.')+'<div class="grid">'+WORK.map(card).join('')+'</div>'},
tech:function(){return title('Tech projects','Things I’ve built. Replace these placeholders with your own.')+'<div class="grid">'+TECH.map(card).join('')+'</div>'},
design:function(){return title('Design projects','Case studies and visual work. Replace these placeholders with your own.')+'<div class="grid">'+DESIGN.map(card).join('')+'</div>'},
sidequests:function(){return title('Side quests','Community, leadership and everything in between.')+'<div class="grid">'+SIDE.map(card).join('')+'</div>'+videos()+'<section class="band"><h2>Recognition</h2><div class="grid" style="margin-top:16px">'+[['CRA Outstanding Undergraduate Researchers nominee','2026'],['EA Dick Asher Award','2026'],['Grace Hopper Conference Scholar','2025'],['BC Excellence Award','2022']].map(function(a){return card({t:a[0],w:a[1],d:''})}).join('')+'</div></section>'}
};
function drag(el,box){var sx,sy,ox,oy;el.addEventListener('pointerdown',function(e){el.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;ox=el.offsetLeft;oy=el.offsetTop;el.style.zIndex=5;
function mv(ev){var x=ox+ev.clientX-sx,y=oy+ev.clientY-sy;x=Math.max(0,Math.min(box.clientWidth-el.offsetWidth,x));y=Math.max(0,Math.min(box.clientHeight-el.offsetHeight,y));el.style.left=x+'px';el.style.top=y+'px'}
function up(){el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up)}
el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up)})}
function stage(){var s=document.getElementById('stage');if(!s)return;
[[0,150,10,20,0],[1,110,170,60,1],[2,90,50,250,0],[3,70,230,230,1]].forEach(function(b){var d=document.createElement('div');d.className='blob';d.style.cssText='width:'+b[1]+'px;height:'+b[1]+'px;left:'+b[2]+'px;top:'+b[3]+'px';d.innerHTML=blob(C[b[0]],b[4],b[0]*25);s.appendChild(d);drag(d,s)})}
function route(){var h=(location.hash||'#home').slice(1);if(!VIEW[h])h='home';
document.getElementById('nav').innerHTML=PAGES.map(function(p){return '<a href="#'+p[0]+'"'+(p[0]==h?' aria-current="page"':'')+'>'+p[1]+'</a>'}).join('');
document.getElementById('app').innerHTML=VIEW[h]();document.title=(h=='home'?'':PAGES.filter(function(p){return p[0]==h})[0][1]+' · ')+'Isabelle Kwan';window.scrollTo(0,0);stage();loadVideos()}
function sticker(html,x,y){var t=document.getElementById('tray'),d=document.createElement('div');d.className='sticker';d.style.left=x+'px';d.style.top=y+'px';d.innerHTML=html;t.appendChild(d);drag(d,t)}
document.getElementById('logoBlob').innerHTML=blob(C[0],1);
[[0,20],[1,130],[2,240]].forEach(function(a,i){sticker(blob(C[i],1,i*30),a[1],30)});
sticker('<div class="slot">drop your<br>drawing</div>',380,60);
document.getElementById('file').addEventListener('change',function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){sticker('<img alt="" src="'+r.result+'">',40+Math.random()*300,60+Math.random()*60)};r.readAsDataURL(f);e.target.value=''});
document.getElementById('theme').addEventListener('click',function(){var r=document.documentElement,d=r.getAttribute('data-theme')=='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);r.setAttribute('data-theme',d?'light':'dark')});
window.addEventListener('hashchange',route);route();
</script>
</body>
</html>
